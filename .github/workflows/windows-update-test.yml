# End-to-end check of Windows self-updating, entirely on a Windows machine: builds an
# old copy (0.0.1) and a new copy (0.0.2) of the current code, both trusting a throwaway
# test key, signs the new one, serves it locally, and checks that the old copy downloads
# it, swaps itself out and relaunches as the new version. The real release key is never
# involved. Runs on every push that touches the updater, and can be run by hand.
name: Windows update test

on:
  workflow_dispatch:
  push:
    paths:
      - "airflow/updater.py"
      - "airflow/app.py"
      - ".github/workflows/windows-update-test.yml"

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements.txt pillow
      - name: Test key
        shell: pwsh
        run: |
          @'
          import base64, json, sys
          sys.path.insert(0, "tests"); sys.path.insert(0, ".")
          import test_update as T
          priv, pub = T.keypair()
          json.dump({"a": priv[0], "prefix": priv[1].hex(), "pub": base64.b64encode(pub).decode()}, open(r"C:\key.json", "w"))
          '@ | Set-Content keygen.py
          python keygen.py
      - name: Build new (0.0.2) and old (0.0.1) copies
        shell: pwsh
        run: |
          $pub = (Get-Content C:\key.json | ConvertFrom-Json).pub
          foreach ($v in "0.0.2", "0.0.1") {
            (Get-Content airflow/config.py) -replace '^VERSION = .*', "VERSION = `"$v`"" `
              -replace '^UPDATE_PUBLIC_KEY = .*', "UPDATE_PUBLIC_KEY = `"$pub`"" | Set-Content airflow/config.py
            pyinstaller --noconfirm --onefile --windowed --name Airflow --exclude-module tkinter main.py --log-level WARN
            New-Item -ItemType Directory -Force "C:\v$v" | Out-Null
            Copy-Item dist\Airflow.exe "C:\v$v\Airflow.exe"
          }
          git checkout airflow/config.py
      - name: Sign and serve the new copy
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\srv, C:\game | Out-Null
          Copy-Item C:\v0.0.2\Airflow.exe C:\srv\Airflow-Windows.exe
          Copy-Item C:\v0.0.1\Airflow.exe C:\game\Airflow.exe
          @'
          import base64, hashlib, json, sys
          sys.path.insert(0, "tests"); sys.path.insert(0, ".")
          import test_update as T
          from airflow import updater as U
          k = json.load(open(r"C:\key.json"))
          priv, pub = (k["a"], bytes.fromhex(k["prefix"])), base64.b64decode(k["pub"])
          sha = hashlib.sha256(open(r"C:\srv\Airflow-Windows.exe", "rb").read()).hexdigest()
          sig = base64.b64encode(T.sign(priv, pub, U.windows_message("0.0.2", sha))).decode()
          json.dump({"version": "0.0.2", "url": "unused", "signature": "unused", "notes": "Test update",
                     "win_url": "http://127.0.0.1:8765/Airflow-Windows.exe", "win_sha256": sha,
                     "win_signature": sig}, open(r"C:\srv\update.json", "w"))
          print("signed", sha)
          '@ | Set-Content sign.py
          python sign.py
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1" -WorkingDirectory C:\srv
          Start-Sleep 2
      - name: Let the old copy update itself
        shell: pwsh
        run: |
          $want = (Get-FileHash C:\srv\Airflow-Windows.exe -Algorithm SHA256).Hash
          $env:AIRFLOW_UPDATE_MANIFEST = "http://127.0.0.1:8765/update.json"
          $env:AIRFLOW_TEST_UPDATE = "1"
          $env:AIRFLOW_SMOKE = "C:\game\after.png"
          $env:AIRFLOW_SMOKE_SECS = "20"
          Start-Process C:\game\Airflow.exe -WorkingDirectory C:\game
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            if ((Get-FileHash C:\game\Airflow.exe -Algorithm SHA256).Hash -eq $want) { $ok = $true; break }
          }
          if (-not $ok) { throw "Airflow.exe was not replaced by the signed update" }
          Write-Host "replaced after $($i*2)s"
          for ($i = 0; $i -lt 45 -and -not (Test-Path C:\game\after.png); $i++) { Start-Sleep 2 }
          if (-not (Test-Path C:\game\after.png)) { throw "the updated game didn't start" }
          Start-Sleep 3
          if (Test-Path C:\game\Airflow.exe.old) { throw "the old copy wasn't cleaned up" }
          Write-Host "updated, relaunched and cleaned up"
      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem C:\game | Format-Table Name, Length
          Get-Process | Where-Object { $_.ProcessName -like "Airflow*" } | Format-Table Id, ProcessName, MainWindowTitle, StartTime
          if (Test-Path "$env:APPDATA\Airflow\update.log") { Get-Content "$env:APPDATA\Airflow\update.log" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after-update-screenshot
          path: C:\game\after.png
